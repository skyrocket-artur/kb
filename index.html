<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>База знаний Skyrocket: тесты, игры, справочники</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel=stylesheet>
<style>
:root{--ink:#0B2545;--b:#1F5FA8;--mid:#4C8FD6;--sky:#A9CBEA;--pale:#E6F0FA;--mu:#6B7F96;--g:#2E8B57;--r:#C0392B;--bg:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif}
body{background-image:linear-gradient(var(--pale) 1px,transparent 1px),linear-gradient(90deg,var(--pale) 1px,transparent 1px);background-size:48px 48px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.top{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--b)}
h1{font-size:34px;font-weight:800;margin:10px 0 6px;letter-spacing:-.01em}h2{font-size:24px;margin:8px 0 14px}
.sub{color:var(--mu);margin-bottom:22px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1.5px solid var(--sky);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--b);transform:translateY(-2px)}.card b{display:block;font-size:17px;margin-bottom:4px}.card span{color:var(--mu);font-size:14px}
.card.game{background:var(--b);border-color:var(--b);color:#fff}.card.game span{color:var(--pale)}
.sec{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--mu);margin:26px 0 10px}
.box{background:#fff;border:1.5px solid var(--sky);border-radius:16px;padding:20px}
.q{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;background:#fff;border:1.5px solid var(--sky);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--b)}.opt.ok{border-color:var(--g);background:#EAF6EF}.opt.no{border-color:var(--r);background:#FBECEA}
.opt:disabled{cursor:default}
.ex{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--pale);line-height:1.45;display:none}.ex.on{display:block}
.ex i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--b)}
.bar{height:6px;background:var(--pale);border-radius:6px;margin:6px 0 18px;overflow:hidden}.bar div{height:100%;background:var(--b);transition:.3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;background:var(--b);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.meta{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mu)}
.big{font-size:56px;font-weight:800;color:var(--b)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .opt{text-align:center;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 16px;font-size:16px}.kv span{color:var(--mu)}
input[type=number]{font:inherit;font-size:20px;width:140px;padding:10px 12px;border:1.5px solid var(--sky);border-radius:12px;color:var(--ink)}
.foot{margin-top:34px;font-size:13px;color:var(--mu);line-height:1.5}.foot a{color:var(--b);font-weight:800;text-decoration:none}
.wm{position:fixed;right:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--sky);pointer-events:none}
</style></head><body><div class=wrap id=app></div><div class=wm>БАЗА ЗНАНИЙ SKYROCKET</div>
<script>
const D={"pdfs": ["Словарь инвестора и трейдера", "Справочник 1. Японские свечи", "Справочник 2. Графические фигуры", "Справочник 3. Индикаторы", "Справочник 4. Мультипликаторы и отчётность", "Справочник 5. Налоги и льготы инвестора", "Справочник 6. Риск-менеджмент и торговая система", "Справочник 7. Фьючерсы", "Справочник 8. Безопасность — мошенники и крипта", "Справочник 9. Правила инвестора"], "tests": [{"id": "1", "title": "Личные финансы", "lessons": "1.1–1.5", "questions": [{"q": "Ставка по вкладу чуть выше официальной инфляции. Почему, по логике урока, вклад всё равно не приумножает капитал?", "options": ["С процентов может удерживаться налог, а личная инфляция часто выше официальной — в итоге вклад в лучшем случае сохраняет деньги", "Вклады не застрахованы государством, поэтому деньги могут пропасть", "Проценты по вкладу не начисляются, пока инфляция выше нуля", "Банк обязательно обанкротится раньше окончания срока вклада"], "correct": 0, "explain": "В уроке 1.1: вклад лишь немного опережает официальную инфляцию, налог и рост цен на ваши реальные покупки съедают остаток — вклад сохраняет, но не приумножает.", "lesson": "1.1"}, {"q": "Доход — 100 000 ₽ в месяц. Сколько по правилу 50/30/20 нужно каждый месяц направлять в сбережения и инвестиции?", "options": ["30 000 ₽", "50 000 ₽", "10 000 ₽", "20 000 ₽"], "correct": 3, "explain": "По правилу 50/30/20 50% идёт на обязательное, 30% — на желания и 20% — на сбережения и инвестиции: 20% от 100 000 = 20 000 ₽.", "lesson": "1.2"}, {"q": "Что на практике означает принцип «заплати сначала себе»?", "options": ["Сначала потратить деньги на желания, чтобы не сорваться, а остаток отложить", "Откладывать долю на инвестиции в день зарплаты, лучше автопереводом, а не из остатка в конце месяца", "Сначала полностью закрыть все подписки и только потом начинать откладывать", "Откладывать только в те месяцы, когда доход вырос"], "correct": 1, "explain": "В конце месяца обычно ничего не остаётся, поэтому в уроке 1.2 предлагают переводить долю на инвестиции сразу после зарплаты, и решение принимается само.", "lesson": "1.2"}, {"q": "Обязательные расходы семьи — 60 000 ₽ в месяц. Какой подушки безопасности достаточно по подходу Артура?", "options": ["Около 180 000 ₽ — примерно 3 месяца обязательных расходов", "60 000 ₽ — одного месяца хватит", "360 000 ₽ — минимум полгода расходов", "720 000 ₽ — годовой запас"], "correct": 0, "explain": "В уроке 1.3 подушка — примерно 3 месяца обязательных расходов: этого хватает, чтобы спокойно найти новый источник дохода.", "lesson": "1.3"}, {"q": "Где лучше держать подушку безопасности по логике урока?", "options": ["На годовом вкладе с повышенной ставкой", "В фонде денежного рынка на брокерском счёте", "В акциях надёжных компаний с дивидендами", "В наличных рублях или долларах — так, чтобы получить деньги в течение суток"], "correct": 3, "explain": "Главное свойство подушки — доступность: со вклада досрочно снимать невыгодно, а операции на брокерском счёте могут приостановить или задержать.", "lesson": "1.3"}, {"q": "У вас три долга: кредитная карта под 30%, потребкредит под 18% и маленькая рассрочка без процентов. Куда направлять свободные деньги по методу лавины?", "options": ["На кредитную карту под 30%, по остальным платить минимум", "На маленькую рассрочку, чтобы быстрее закрыть хоть один долг", "Поровну на все три долга", "В инвестиции — рынок вырастет и покроет проценты"], "correct": 0, "explain": "Метод лавины: минимум по всем долгам, а все свободные деньги — на долг с самой высокой ставкой, так переплата минимальна. Закрытие самого маленького долга — это метод снежного кома.", "lesson": "1.3"}, {"q": "Какой порядок действий предлагается в уроке, прежде чем начинать инвестировать?", "options": ["Инвестиции → подушка на 3 месяца → закрыть дорогие долги", "Минимум по всем долгам → запас на месяц → закрыть дорогие долги → подушка на 3 месяца → инвестиции", "Закрыть все долги, включая ипотеку → инвестиции → подушка", "Подушка на год → инвестиции → закрыть долги из прибыли"], "correct": 1, "explain": "В уроке 1.3 инвестиции стоят только на пятом месте — после минимальных платежей, небольшого запаса, закрытия дорогих долгов и полной подушки.", "lesson": "1.3"}, {"q": "Цель — машина за 2 000 000 ₽ через 2 года, инфляция — 10% в год. Сколько она будет стоить к сроку по формуле из урока?", "options": ["2 400 000 ₽", "2 200 000 ₽", "2 420 000 ₽", "2 000 000 ₽"], "correct": 2, "explain": "Будущая стоимость = текущая × (1 + инфляция)^лет: 2 000 000 × 1,1² = 2 420 000 ₽. Простое прибавление 10% за каждый год не учитывает сложного роста цен.", "lesson": "1.4"}, {"q": "Деньги на отпуск понадобятся через 8 месяцев. Куда их разумнее положить по логике урока?", "options": ["В акции — у них самая высокая доходность", "В криптовалюту — за 8 месяцев она может вырасти в разы", "На вклад или в короткие облигации — не в рискованные активы", "Во фьючерсы с плечом, чтобы быстрее заработать"], "correct": 2, "explain": "Инструмент выбирают под срок: деньги, нужные в течение года, не держат в рискованных активах — рынок может просесть как раз к моменту покупки.", "lesson": "1.4"}, {"q": "Все в чате обсуждают акцию, которая выросла вдвое, и вам очень хочется купить. Что советует урок?", "options": ["Купить на всю сумму, пока рост не закончился", "Остановиться и проверить, укладывается ли покупка в вашу стратегию: чаще всего к этому моменту рост уже позади", "Взять кредит, чтобы купить побольше, — выгода очевидна", "Продать все остальные бумаги и переложиться в эту акцию"], "correct": 1, "explain": "Это ловушка страха упустить выгоду (FOMO) и стадного чувства: совет из чата — не анализ, а покупка на ажиотаже часто приходится на вершину.", "lesson": "1.5"}]}, {"id": "2", "title": "Биржа, брокер и безопасность", "lessons": "2.1–2.7", "questions": [{"q": "Брокер, у которого лежат ваши акции, обанкротился. Что произойдёт с бумагами?", "options": ["Акции пропадут вместе с брокером", "Акции застрахованы так же, как банковские вклады", "Акции перейдут в собственность биржи", "Они учитываются в депозитарии отдельно от имущества брокера и записаны на вас — их переведут к другому брокеру"], "correct": 3, "explain": "Купленные бумаги записаны на ваше имя в депозитарии. Но деньги на брокерском счёте не застрахованы, как вклады, поэтому брокера выбирают крупного и надёжного.", "lesson": "2.1"}, {"q": "Вы хотите купить малоликвидную акцию с широким спредом и не готовы платить больше 150 ₽. Какую заявку выбрать?", "options": ["Лимитную с ценой 150 ₽", "Рыночную — исполнится мгновенно", "Стоп-маркет с ценой активации 150 ₽", "Тейк-профит на 150 ₽"], "correct": 0, "explain": "Лимитная заявка исполняется не дороже указанной цены. Рыночная в тонком стакане может исполниться заметно дороже — это проскальзывание.", "lesson": "2.3"}, {"q": "Почему в ликвидных бумагах и фьючерсах для защиты обычно используют стоп-маркет, а не стоп-лимит?", "options": ["Стоп-маркет всегда исполняется точно по цене активации", "Стоп-лимит запрещено ставить на ликвидные бумаги", "Стоп-маркет гарантирует выход, а стоп-лимит при резком движении или гэпе может не исполниться и оставить вас в убыточной позиции", "У стоп-маркета нет комиссии"], "correct": 2, "explain": "Стоп-маркет при активации отправляет рыночную заявку: цена может проскользнуть, но выход гарантирован. Стоп-лимит, если его всё же ставят, ставят с запасом.", "lesson": "2.3"}, {"q": "Вы купили акции хорошей компании на годы. Она упала на 20%, но инвестиционная идея не изменилась. Как поступил бы Артур?", "options": ["Не продавать: в инвестициях стоп-лосс не ставится, просадку хорошей бумаги можно использовать для докупки частями", "Сработал бы стоп-лосс 5%, и позиция была бы закрыта", "Продать всё и откупить ещё ниже", "Поставить стоп-лосс на 25% ниже входа и ждать"], "correct": 0, "explain": "Стоп-лосс — инструмент трейдера. В инвестициях Артур выходит руками, только если идея потеряла смысл или поменялся сентимент, а риск контролирует долей в портфеле.", "lesson": "2.3"}, {"q": "Торговый депозит — 200 000 ₽, риск на сделку — 1%. Вход по 500 ₽, стоп — 480 ₽. Сколько акций можно купить?", "options": ["400", "40", "1 000", "100"], "correct": 3, "explain": "Риск в деньгах — 2 000 ₽, риск на акцию — 20 ₽; 2 000 / 20 = 100 акций. Размер позиции считают от стопа, а не от суммы на счёте.", "lesson": "2.3"}, {"q": "Где Артур ставит стоп-лосс в сделке на покупку (лонг)?", "options": ["Ровно на линии поддержки, без запаса", "На фиксированные 1% от входа, независимо от графика", "Не ставит, а следит за ценой руками", "За локальным минимумом, с небольшим запасом на проскальзывание"], "correct": 3, "explain": "Возле уровней цена часто делает ложные проколы, поэтому стоп ставят не прямо на уровне, а за локальным минимумом с запасом.", "lesson": "2.3"}, {"q": "В каком порядке правильно анализировать график?", "options": ["Сначала минутный график, потом дневной для подтверждения", "Сначала старший таймфрейм — тренд и крупные уровни, потом младший — точка входа", "Только младший таймфрейм: старший слишком запаздывает", "Порядок не важен, главное — добавить побольше индикаторов"], "correct": 1, "explain": "Правило из урока 2.5 — смотреть сверху вниз. И не перегружать график: уровней, объёма и одного-двух индикаторов достаточно.", "lesson": "2.5"}, {"q": "В TradingView цена отличается от цены в приложении брокера. Как поступить?", "options": ["Выставлять заявку строго по цене из TradingView", "Перестать пользоваться брокером и торговать прямо в TradingView", "Анализ делать в TradingView, а цену заявки всегда сверять в стакане у брокера", "Ждать, пока цены совпадут, и только тогда торговать"], "correct": 2, "explain": "Котировки в TradingView могут немного отличаться или приходить с задержкой: это платформа для анализа, а сделки совершаются у брокера.", "lesson": "2.5"}, {"q": "За год на одном брокерском счёте вы заработали 50 000 ₽ на одной российской акции и потеряли 20 000 ₽ на другой. С какой суммы удержат налог?", "options": ["С 50 000 ₽ — убытки не учитываются", "С 30 000 ₽ — прибыль и убыток на счёте за год складываются", "С 70 000 ₽", "Налог не удержат, пока вы не подадите декларацию"], "correct": 1, "explain": "По уроку 2.6 прибыль и убытки за год на одном счёте сальдируются, и брокер делает это автоматически.", "lesson": "2.6"}, {"q": "«Консультант» в мессенджере помог открыть счёт на платформе, разрешил вывести небольшую сумму, а теперь для вывода крупной просит заплатить «налог». Что это?", "options": ["Обычная практика: перед выводом нужно оплатить налог", "Нормально, раз небольшую сумму вывести дали", "Типичная схема мошенников: плата за вывод собственных денег — признак обмана, и одного признака достаточно, чтобы остановиться", "Нужно заплатить, а потом проверить компанию в справочнике"], "correct": 2, "explain": "В схеме «личный консультант» маленький вывод — это наживка, а прибыль на экране — просто картинка. Легальный брокер не берёт отдельную плату за вывод ваших же денег.", "lesson": "2.7"}]}, {"id": "3", "title": "Инструменты", "lessons": "3.1–3.5", "questions": [{"q": "Дата закрытия реестра по дивидендам — среда. До какого дня нужно купить акции, чтобы получить выплату?", "options": ["В среду до закрытия торгов", "В четверг — после даты реестра", "В любой день до фактической выплаты дивидендов", "Не позднее вторника — минимум за один рабочий день до даты закрытия реестра"], "correct": 3, "explain": "Сделки на бирже проходят на следующий рабочий день, поэтому купить нужно минимум за день до даты закрытия реестра.", "lesson": "3.1"}, {"q": "Акция стоит 5 ₽, в лоте 100 штук. Какова минимальная сумма покупки?", "options": ["5 ₽", "500 ₽", "100 ₽", "5 000 ₽"], "correct": 1, "explain": "Акции продаются лотами: минимальная покупка — цена акции × количество в лоте = 5 × 100 = 500 ₽.", "lesson": "3.1"}, {"q": "Облигация номиналом 1 000 ₽ торгуется по цене 97%. Сколько вы заплатите за неё (без НКД) и сколько получите при погашении?", "options": ["Заплачу 1 000 ₽, при погашении получу 970 ₽", "Заплачу 97 ₽, при погашении получу 100 ₽", "Заплачу 970 ₽, при погашении получу 1 000 ₽", "Заплачу 970 ₽, при погашении получу 970 ₽"], "correct": 2, "explain": "Цену облигации пишут в процентах от номинала, а погашают по полному номиналу: разница 30 ₽ — тоже ваш доход.", "lesson": "3.2"}, {"q": "При покупке облигации вы заплатили продавцу накопленный купонный доход (НКД). Это потеря?", "options": ["Да, это комиссия продавца, она не возвращается", "Нет: НКД вернётся вместе с ближайшим купоном", "Да, это налог, который удерживают при покупке", "Нет, НКД вернут только при погашении облигации"], "correct": 1, "explain": "НКД — часть купона, которую заработал продавец, пока держал облигацию. Вы компенсируете её и получаете обратно в составе ближайшего купона.", "lesson": "3.2"}, {"q": "Вы ожидаете, что ключевая ставка вырастет. Какая облигация с фиксированным купоном пострадает меньше всего?", "options": ["Длинная, с погашением через 15 лет", "Любая — сроки на реакцию цены не влияют", "Та, у которой самый высокий купон, независимо от срока", "Короткая, с погашением через год"], "correct": 3, "explain": "При росте ставки цены выпущенных облигаций падают, и чем длиннее облигация, тем сильнее реакция. Короткие ведут себя почти как вклад.", "lesson": "3.2"}, {"q": "По какому показателю правильнее сравнивать облигации между собой и со вкладом?", "options": ["По доходности к погашению — она учитывает купоны, цену покупки и возврат номинала", "По размеру купона", "По номиналу", "По цене в процентах — чем ниже, тем выгоднее"], "correct": 0, "explain": "Купон не учитывает, дороже или дешевле номинала вы купили бумагу. Доходность к погашению сводит всё в одну цифру, сравнимую со ставкой по вкладу.", "lesson": "3.2"}, {"q": "У облигации через год оферта, а погашение — через 5 лет. До какой даты считать доходность?", "options": ["До погашения — оферта ни на что не влияет", "До оферты: в этот день компания может выкупить облигацию или поменять купон", "До ближайшей выплаты купона", "До конца текущего года"], "correct": 1, "explain": "В день оферты условия могут измениться, поэтому для таких облигаций доходность считают до оферты; в приложении брокера её дату показывают отдельно.", "lesson": "3.3"}, {"q": "У двух облигаций одинаковый рейтинг, но одна даёт доходность намного выше остальных. Как это понимать?", "options": ["Рынок видит в ней дополнительный риск — слишком высокая доходность должна насторожить", "Это недосмотр рынка и гарантированная выгода", "Значит, у неё обязательно плавающий купон", "Значит, у неё скоро повысят рейтинг"], "correct": 0, "explain": "В уроке 3.3: если у компании с таким же рейтингом доходность заметно выше, чем у похожих, рынок закладывает риск. Это повод разобраться, а не радоваться.", "lesson": "3.3"}, {"q": "Почему Артур не держит подушку безопасности в фонде денежного рынка, хотя тот растёт вместе с ключевой ставкой?", "options": ["Фонды денежного рынка всегда приносят убыток", "В таких фондах нельзя продать паи раньше чем через год", "Подушка должна быть доступна в течение суток и не зависеть от биржи и брокера", "Фонды денежного рынка облагаются двойным налогом"], "correct": 2, "explain": "Фонд денежного рынка удобен, чтобы деньги не простаивали между покупками, но подушка — отдельные деньги с гарантированным быстрым доступом.", "lesson": "3.4"}, {"q": "Новичок хочет вложить половину капитала в золото «ради заработка». Что не так по логике урока?", "options": ["Золото — защитный актив без купонов и дивидендов: его держат как страховку, обычно небольшой долей (5–15%), а рост ищут в акциях и облигациях", "Золото нельзя купить на бирже", "Золото всегда дешевеет в кризисы", "Всё правильно: золото — главный источник дохода портфеля"], "correct": 0, "explain": "Валюта и золото защищают от слабого рубля и кризисов, но сами почти не приносят дохода — зарабатывают на них только на росте цены.", "lesson": "3.5"}]}, {"id": "4", "title": "Фундаментальный анализ", "lessons": "4.1–4.4", "questions": [{"q": "Капитализация компании — 500 млрд ₽, чистая прибыль за год — 100 млрд ₽. Чему равен P/E и что это значит?", "options": ["0,2: компания стоит в 5 раз дешевле прибыли", "5: компания вырастет в цене в 5 раз", "500: компания очень сильно переоценена", "5: при той же прибыли компания окупит свою цену примерно за 5 лет"], "correct": 3, "explain": "P/E = капитализация / чистая прибыль = 500 / 100 = 5. Сравнивать его имеет смысл только с компаниями той же отрасли.", "lesson": "4.1"}, {"q": "У металлурга на пике цен на сырьё P/E всего 3. Почему это может быть ловушкой?", "options": ["У циклических компаний прибыль на пике высокая, и мультипликатор кажется маленьким как раз перед падением прибыли", "Низкий P/E всегда означает, что компания скоро обанкротится", "У металлургов P/E не считают", "Это не ловушка: P/E 3 — всегда сигнал к покупке"], "correct": 0, "explain": "Для сырьевых компаний в уроке советуют опираться на EV/EBITDA, долг к EBITDA и доходность свободного денежного потока, а P/E на пике цикла не брать за основу.", "lesson": "4.1"}, {"q": "Вы анализируете банк. Какие мультипликаторы подходят лучше всего?", "options": ["EV/EBITDA и чистый долг к EBITDA", "Цена к капиталу (P/BV), рентабельность капитала (ROE) и P/E", "Цена к выручке и рост выручки", "Маржа по EBITDA и капитальные затраты"], "correct": 1, "explain": "Бизнес банков устроен иначе, выручку и EBITDA у них не считают. Смотрят на P/BV, ROE и P/E.", "lesson": "4.1"}, {"q": "Долг компании — 300 млрд ₽, денег на счетах — 100 млрд ₽, EBITDA — 50 млрд ₽. Как оценить долговую нагрузку?", "options": ["Чистый долг / EBITDA = 6 — нормально для любой компании", "Чистый долг / EBITDA = 2 — комфортно", "Чистый долг / EBITDA = 4 — выше трёх, это повод насторожиться", "Чистый долг / EBITDA = 8 — компания уже банкрот"], "correct": 2, "explain": "Чистый долг = долги − деньги = 200 млрд; 200 / 50 = 4. По уроку до двух — комфортно, выше трёх — повод насторожиться.", "lesson": "4.1"}, {"q": "Две компании из одной отрасли: у первой P/E 4 и чистый долг/EBITDA 4, у второй P/E 7 и почти нет долга. Какой вывод ближе к уроку?", "options": ["Первая однозначно лучше — у неё ниже P/E", "Компании одинаковы: средний мультипликатор у них похожий", "Первая выглядит дешевле, но вторая надёжнее — мультипликаторы нужно смотреть вместе, рынок не зря платит за неё больше", "Вторая хуже: отсутствие долга говорит о слабом росте"], "correct": 2, "explain": "Дешёвая компания бывает ловушкой: рынок даёт скидку за долги, санкции или падающую прибыль. Один мультипликатор картину не показывает.", "lesson": "4.1"}, {"q": "Выручка выросла на 10%, операционная прибыль — на 5%, а чистая прибыль удвоилась. Что сделать в первую очередь?", "options": ["Покупать: удвоение прибыли — сильный сигнал", "Найти в отчёте причину скачка: скорее всего, это разовая статья — продажа актива, курсовые разницы или переоценка", "Продавать: рост прибыли всегда означает пик", "Ничего: чистая прибыль — самый надёжный показатель"], "correct": 1, "explain": "Чистую прибыль часто искажают разовые статьи, которые не повторятся в следующем году. Без них прибыль могла почти не измениться.", "lesson": "4.2"}, {"q": "Операционный денежный поток компании — 120 млрд ₽, капитальные затраты — 80 млрд ₽. Чему равен свободный денежный поток?", "options": ["200 млрд ₽", "120 млрд ₽", "1,5", "40 млрд ₽"], "correct": 3, "explain": "Свободный денежный поток = операционный поток − капзатраты = 120 − 80 = 40 млрд ₽. Именно к нему часто привязаны дивиденды.", "lesson": "4.2"}, {"q": "Прибыль в отчёте растёт третий год подряд, а денег у компании не прибавляется. Как это понимать?", "options": ["Хороший знак: компания всё реинвестирует", "Это нормально для любой компании, на это не смотрят", "Тревожный сигнал: прибыль может оставаться на бумаге — в долгах покупателей или запасах на складе", "Значит, компания скрывает деньги от налогов"], "correct": 2, "explain": "Отчёт о движении денег показывает реальные деньги. Если прибыль растёт, а денег нет, в уроке 4.2 это красный флаг.", "lesson": "4.2"}, {"q": "Компания объявила о первичном размещении (IPO), реклама повсюду. Какой подход урок называет разумным?", "options": ["Подождать полгода–год: компания покажет пару отчётов, ажиотаж уляжется, а цена часто становится ниже", "Подать заявку на максимальную сумму: в первый день акции всегда растут", "Купить на открытии первого дня торгов", "Взять кредит и участвовать: организатор поддерживает цену"], "correct": 0, "explain": "Компания и её владельцы выбирают момент выхода, когда оценки высокие. Частный инвестор — единственный в цепочке, кто ничего себе не гарантирует.", "lesson": "4.3"}, {"q": "Инвестор покупает акции за день до отсечки, только чтобы получить дивиденд и сразу продать. Почему это не даёт выгоды «в теории»?", "options": ["Дивиденды за такие короткие сроки не выплачивают", "Брокер блокирует продажу акций на месяц после отсечки", "Цена после отсечки всегда растёт, и продавать невыгодно", "После отсечки цена обычно падает примерно на размер дивиденда, а с дивиденда ещё удерживают налог"], "correct": 3, "explain": "Это дивидендный гэп: пока он не закроется, вы в минусе. Для долгосрочного инвестора гэп скорее возможность купить дешевле.", "lesson": "4.4"}]}, {"id": "5", "title": "Портфель и психология", "lessons": "5.1–5.6", "questions": [{"q": "Чему научил практикум по фундаментальному анализу: чего этот анализ НЕ даёт?", "options": ["Понимания бизнеса компании", "Оценки долговой нагрузки", "Сравнения мультипликаторов с конкурентами", "Точки входа: что покупать, он подсказывает, а когда — подсказывает технический анализ"], "correct": 3, "explain": "Анализ верно описал обе компании, но одну из них летом можно было купить намного дешевле. Момент и части подсказывает технический анализ.", "lesson": "5.1"}, {"q": "Вы решили вложить в акцию 90 000 ₽. Как купить по правилу «покупайте частями»?", "options": ["Все 90 000 ₽ сразу, чтобы не упустить рост", "Примерно 30 000 ₽ сразу, остальное докупить, если цена снизится к следующим уровням", "Ждать, пока цена упадёт на 50%, и купить всё", "Купить на 90 000 ₽ и ещё столько же с плечом"], "correct": 1, "explain": "Седьмое правило: разделить сумму примерно на три части — первую сразу, остальные при снижении к следующим уровням.", "lesson": "5.2"}, {"q": "Вы наметили покупку от уровня, но акция уже ушла на несколько процентов выше точки входа. Что делать?", "options": ["Дождаться отката или пропустить сделку — не догонять цену", "Срочно купить по рынку, пока не убежала дальше", "Купить на двойную сумму, чтобы компенсировать худшую цену", "Купить с плечом"], "correct": 0, "explain": "Восьмое правило: не догоняйте цену. Возможности на рынке будут ещё.", "lesson": "5.2"}, {"q": "Портфель 1 000 000 ₽: 60% акций и 40% облигаций. За год акции выросли на 50%, облигации — на 10%. Какой стала доля акций?", "options": ["60%", "75%", "Около 55%", "Около 67%"], "correct": 3, "explain": "Акции: 600 000 × 1,5 = 900 000; облигации: 400 000 × 1,1 = 440 000; 900 / 1 340 ≈ 67%. Риск вырос сам собой — нужна ребалансировка.", "lesson": "5.5"}, {"q": "Какой способ ребалансировки урок называет самым экономным?", "options": ["Каждую неделю продавать всё, что выросло", "Раз в год продавать весь портфель и собирать заново", "Пополнениями: новые деньги направлять в актив, доля которого стала меньше целевой", "Не ребалансировать вообще"], "correct": 2, "explain": "При ребалансировке пополнениями ничего не продаётся, а значит, нет налога и лишних комиссий.", "lesson": "5.5"}, {"q": "Целевая доля акций — 60%, вы ребалансируете «по отклонению» на 5 процентных пунктов. Когда пора действовать?", "options": ["При любом отклонении, даже на 1 п.п.", "Когда доля акций дойдёт до 65% или опустится до 55%", "Только когда доля дойдёт до 80%", "Когда акции упадут на 5% за день"], "correct": 1, "explain": "Способ по отклонению: ждёте, пока доля уйдёт от цели на заданную величину, здесь ±5 п.п. от 60%.", "lesson": "5.5"}, {"q": "Инвестору 40 лет. Какую долю облигаций предлагает простое стартовое правило из урока?", "options": ["Около 40%", "Около 10%", "Около 80%", "0%: в 40 лет облигации не нужны"], "correct": 0, "explain": "Правило для старта: доля облигаций примерно равна возрасту. Оно не обязательно, но снижает риски.", "lesson": "5.5"}, {"q": "Что обычно составляет «ядро» портфеля?", "options": ["Отдельные идеи роста и мемкоины", "Индексные фонды, крупные надёжные компании и облигации", "Фьючерсы с плечом", "Акции, которые советуют в чатах"], "correct": 1, "explain": "Ядро — большая и надёжная часть портфеля. Спутники — небольшая доля идей роста, на которых можно и заработать больше, и потерять.", "lesson": "5.3"}, {"q": "Почему в уроке советуют покупать активы через брокера той страны, где они торгуются?", "options": ["Меньше посредников между вами и бумагой — меньше риск, что её заблокируют", "Так ниже налоги в любой стране", "Иностранные брокеры запрещены", "Так гарантированно выше доходность"], "correct": 0, "explain": "После санкций инвесторы надолго потеряли доступ к иностранным бумагам, купленным через посредников. Риск блокировки учитывают наравне с риском падения.", "lesson": "5.3"}, {"q": "Знакомые, которые никогда не инвестировали, советуют акции, люди берут кредиты на покупки, размещения идут одно за другим. Что это значит?", "options": ["Признаки дна — время покупать на все деньги", "Стадия накопления: крупные игроки набирают позиции", "Признаки эйфории — время быть осторожнее", "Ничего: настроение толпы на цены не влияет"], "correct": 2, "explain": "В эйфории риск самый высокий. Принцип Баффетта: будьте осторожны, когда другие жадничают, и смелы, когда другие боятся.", "lesson": "5.6"}]}, {"id": "6", "title": "Криптовалюта", "lessons": "6.1–6.7", "questions": [{"q": "Что происходит при халвинге биткоина?", "options": ["Количество уже выпущенных биткоинов делится пополам", "Цена биткоина автоматически удваивается", "Комиссия за переводы снижается вдвое", "Награда майнерам за блок делится пополам — новых монет выпускается вдвое меньше"], "correct": 3, "explain": "Халвинг примерно раз в четыре года вдвое сокращает выпуск. При прежнем спросе это создаёт дефицит, но прошлые циклы будущих не гарантируют.", "lesson": "6.2"}, {"q": "Доминация биткоина заметно снижается. Как это читать?", "options": ["Деньги перетекают в альткоины — это называют альтсезоном", "Деньги уходят в биткоин — так бывает в страхе", "Рынок криптовалют закрывается", "Биткоин скоро перестанут выпускать"], "correct": 0, "explain": "Рост доминации — деньги идут в биткоин, падение — в альткоины. Но альткоины растут быстрее и падают сильнее.", "lesson": "6.2"}, {"q": "Как использовать четырёхлетний цикл на практике по логике урока?", "options": ["Покупать всё на пике после халвинга, когда новостей больше всего", "Не покупать на эйфории после пика и накапливать частями на долгом скучном дне, не ставя всё на календарь халвингов", "Вложить все деньги ровно в день халвинга", "Игнорировать циклы: на крипте они никогда не работали"], "correct": 1, "explain": "Цикл — не закон природы: с приходом крупных инвесторов он может сглаживаться. Поэтому понимаем стадию рынка и покупаем частями.", "lesson": "6.2"}, {"q": "На экране у мелкой монеты +300%, но оборот у неё — несколько десятков тысяч долларов в день. В чём главный риск?", "options": ["Никакого риска — прибыль уже зафиксирована", "Низкая ликвидность: продажа даже на небольшую сумму сдвинет цену на десятки процентов, и прибыль не получится забрать", "Монету обязательно добавят на крупную биржу", "Высокий оборот привлечёт продавцов"], "correct": 1, "explain": "Ликвидность важнее красивого графика: смотрите объём за сутки, глубину стакана и спред.", "lesson": "6.4"}, {"q": "Монету вот-вот добавят на крупную биржу (листинг). Чего стоит ожидать по уроку?", "options": ["Часто работает «покупай на слухах, продавай на новостях»: ранние держатели продают, и после первых часов цена нередко ниже, чем до листинга", "Цена гарантированно вырастет в несколько раз и останется там", "Листинг никак не влияет на цену", "После листинга монету нельзя продать"], "correct": 0, "explain": "Листинг часто становится точкой продажи, а не покупки. Добавьте сюда ещё и риск разблокировок токенов команды и фондов.", "lesson": "6.4"}, {"q": "График токена красиво растёт, но никто не может его продать. Как называется схема и как себя проверить?", "options": ["Раг пулл: подключить кошелёк к сайту проекта", "Халвинг: подождать четыре года", "Ханипот: купить на маленькую сумму и попробовать продать", "Листинг: дождаться добавления на биржу"], "correct": 2, "explain": "В ханипоте продажу запрещает код токена, поэтому график растёт. Чек-лист урока: купить чуть-чуть и проверить, получится ли продать.", "lesson": "6.4"}, {"q": "Какая структура криптопортфеля ближе всего к уроку?", "options": ["Крипта — половина капитала, всё в мемкоинах", "Крипта — 10%, но с плечом 10, чтобы ускорить рост", "Крипта — около 10% инвестиций, без плеча; внутри биткоин — от половины до двух третей, эфириум — около четверти, остальное — крупные альткоины малыми долями", "Только новые токены: у них самый большой потенциал"], "correct": 2, "explain": "Основа — биткоин и эфириум, альткоины понемногу, мемкоины только на сумму, которую не жалко. Плечо на крипте не используется.", "lesson": "6.5"}, {"q": "Получатель принимает USDT только в сети Трон, а вы по привычке выбрали другую сеть. Что может произойти?", "options": ["Ничего: биржа сама переведёт монеты в нужную сеть", "Перевод просто придёт чуть позже", "Монеты можно потерять: сеть отправителя и получателя должна совпадать", "Сеть влияет только на размер комиссии"], "correct": 2, "explain": "USDT выпущен в нескольких блокчейнах — это разные дороги. Сначала выбирают сеть, потом копируют адрес. Вернуть монеты из чужой сети биржа может только за плату, и без гарантий.", "lesson": "6.7"}, {"q": "Биржа-получатель показывает при пополнении поле «мемо». Что будет, если его не заполнить?", "options": ["Перевод не уйдёт с биржи-отправителя", "Ничего, мемо — просто необязательный комментарий", "Монеты зачислятся, но с комиссией", "Монеты дойдут, но не зачислятся на ваш счёт"], "correct": 3, "explain": "Если получатель показывает мемо (тег), его обязательно вводят — без него биржа не поймёт, кому зачислить перевод.", "lesson": "6.7"}, {"q": "В истории переводов есть адрес, на который вы уже отправляли USDT. Можно ли скопировать его оттуда?", "options": ["Да, адреса из истории самые надёжные", "Да, если сумма перевода небольшая", "Да, если адрес начинается с тех же символов", "Нет: мошенники присылают крошечные суммы с очень похожих адресов, адрес берут у получателя и сверяют начало и конец"], "correct": 3, "explain": "Адрес из истории переводов — одна из четырёх ошибок, из-за которых теряют деньги. Для нового адреса сначала отправляют тестовую сумму.", "lesson": "6.7"}]}, {"id": "7", "title": "Трейдинг", "lessons": "7.1–7.17", "questions": [{"q": "Вы открыли позицию с плечом 5. Цена пошла против вас на 10%. Какую часть депозита вы потеряли?", "options": ["10%", "2%", "Половину — 50%", "Весь депозит — 100%"], "correct": 2, "explain": "Плечо ускоряет и прибыль, и убыток: 10% × 5 = 50%. Поэтому в трейдинге обязательны стоп и ограниченный риск на сделку.", "lesson": "7.1"}, {"q": "Цена пробила сопротивление на 300 ₽ и закрепилась выше. Затем вернулась к 300 ₽. Какую роль, скорее всего, сыграет этот уровень?", "options": ["Поддержки: пробитое сопротивление меняет роль", "Он больше не имеет значения", "Сопротивления, которое снова отбросит цену вниз", "Уровня, от которого нужно открыть шорт"], "correct": 0, "explain": "Пробитое сопротивление часто становится поддержкой: цена возвращается к уровню, проверяет его и идёт дальше.", "lesson": "7.2"}, {"q": "У поддержки на дневном графике формируется молот, но до закрытия свечи ещё 3 часа. Когда входить?", "options": ["Сейчас, пока цена не убежала", "Как только хвост станет вдвое длиннее тела, не дожидаясь закрытия", "После закрытия свечи, а лучше после подтверждения следующей свечой", "Не важно — модель уже сформировалась"], "correct": 2, "explain": "Модель появляется только после закрытия свечи: до конца периода красивый молот может превратиться в обычную падающую свечу.", "lesson": "7.3"}, {"q": "Цена обновила минимум, а RSI сделал минимум выше предыдущего. Что это?", "options": ["Бычья дивергенция — продавцы выдыхаются", "Медвежья дивергенция — падение усилится", "Перекупленность — пора продавать", "Ложный сигнал, на который не смотрят"], "correct": 0, "explain": "Дивергенция — самый сильный сигнал RSI, особенно у сильного уровня и вместе с разворотной свечой.", "lesson": "7.4"}, {"q": "Цена ниже 200-дневной скользящей средней, и средняя смотрит вниз. Как это учесть?", "options": ["Покупать на каждом касании средней", "Это сигнал к покупке — цена ниже средней, значит, дёшево", "Скользящие средние тренд не показывают", "Тренд нисходящий — покупки от уровней здесь против тренда, лучше их отфильтровать"], "correct": 3, "explain": "Скользящие средние лучше работают как фильтр тренда: сначала тренд по 200-дневной, потом вход по связке «уровень + RSI + свеча» — только по тренду.", "lesson": "7.5"}, {"q": "Цена пробила сопротивление, но объём почти не изменился. Как оценить такой пробой?", "options": ["Это самый надёжный пробой — продавцов не осталось", "Он часто оказывается ложным — надёжный пробой идёт на большом объёме", "Объём на пробой не влияет", "Это капитуляция — нужно покупать"], "correct": 1, "explain": "Объём подтверждает движение: пробой без роста объёма — одна из частых ошибок урока 7.8.", "lesson": "7.8"}, {"q": "Шаг цены фьючерса — 50 пунктов, стоимость шага — 10 ₽. Вы купили по 20 000 пунктов и продали по 21 000. Какова прибыль на 1 контракт?", "options": ["1 000 ₽", "10 000 ₽", "200 ₽", "500 ₽"], "correct": 2, "explain": "Результат считают в шагах: 1 000 пунктов / 50 = 20 шагов × 10 ₽ = 200 ₽, а не 1 000.", "lesson": "7.9"}, {"q": "Вы держите фьючерс на Московской бирже 3 торговых дня. Как будут начисляться прибыль и убыток (вариационная маржа)?", "options": ["Один раз — только при закрытии сделки", "Непрерывно, с каждым изменением цены", "Раз в неделю, по пятницам", "Три раза — один раз в день на вечернем клиринге"], "correct": 3, "explain": "На срочном рынке прибыль и убыток начисляются не при закрытии, а на клиринге — один раз в день, в конце торгового дня.", "lesson": "7.9"}, {"q": "Фьючерс на индекс торгуется дороже самого индекса (контанго). Что это значит?", "options": ["Главная причина — стоимость денег: купив фьючерс, вы не тратите деньги на актив и можете держать их под процент", "Рынок уверен в росте индекса", "Скоро обязательно начнётся падение", "Биржа ошиблась в расчёте цены"], "correct": 0, "explain": "Считать контанго прогнозом роста — частая ошибка. Цену фьючерса определяют ставка и дивиденды, а к экспирации она сходится с ценой актива.", "lesson": "7.10"}, {"q": "Контракт на 10 баррелей нефти: купили по 80 $, продали по 83 $. Курс — 100 ₽ за доллар. Каков результат в рублях?", "options": ["300 ₽", "3 000 ₽", "30 ₽", "30 000 ₽"], "correct": 1, "explain": "Сначала считаем в долларах: 3 $ × 10 баррелей = 30 $, затем переводим по курсу: 30 × 100 = 3 000 ₽. На долларовый контракт влияют и цена, и курс.", "lesson": "7.10"}, {"q": "Вы сделали 10 сделок с риском 1 000 ₽: 4 прибыльные по +3 000 ₽ и 6 убыточных по −1 000 ₽. Каков итог?", "options": ["−2 000 ₽", "0 ₽", "+6 000 ₽", "+12 000 ₽"], "correct": 2, "explain": "4 × 3 000 − 6 × 1 000 = +6 000 ₽. Результат трейдера складывается из размера прибылей и убытков, а не из процента угаданных сделок.", "lesson": "7.11"}, {"q": "Вы торгуете нефть и хотите открыть сделку в газе. Как учесть разницу?", "options": ["Взять тот же объём, что и в нефти", "Взять в газе позицию меньше: он заметно волатильнее нефти", "Взять объём больше: газ движется плавнее", "Не ставить стоп: газ быстро возвращается"], "correct": 1, "explain": "Движение на несколько процентов за день для газа — обычное дело. Торговать газ таким же объёмом, как нефть, — частая ошибка из урока 7.12.", "lesson": "7.12"}, {"q": "Сильная новость — и акция открылась гэпом сразу на 5% выше сопротивления. Как действовать по стратегии пробоя?", "options": ["Купить по рынку на открытии, пока не убежала", "Открыть шорт — гэп всегда закрывается", "Купить на всю сумму без стопа — новость сильная", "Не догонять гэп: дождаться, удержится ли цена выше уровня в первые часы, и входить на откате"], "correct": 3, "explain": "Сигнал — не сама новость, а реакция цены. Догонять гэп на новости — одна из частых ошибок урока 7.14.", "lesson": "7.14"}, {"q": "Вы вошли в сделку без сигнала по своей системе, и она принесла прибыль. Как её оценить?", "options": ["Как успех: прибыль — главное мерило", "Как ошибку: сделка вне правил приучает нарушать систему", "Как повод добавить это правило в систему", "Как знак, что систему пора полностью переделать"], "correct": 1, "explain": "Самое сложное в системе — её соблюдать. Менять правила нужно по данным за 20–30 сделок, а не по одной удачной сделке.", "lesson": "7.16"}, {"q": "Фундаментальный анализ говорит, что компания дешёвая, а технический — что тренд нисходящий. Как поступить?", "options": ["Покупать меньше и медленнее: малыми частями или дождаться разворота, оставив запас денег", "Купить всё сразу — фундамент важнее", "Открыть шорт с плечом — тренд важнее", "Никогда не покупать эту компанию"], "correct": 0, "explain": "Если анализы говорят одно и то же — сигнал сильный, если спорят — покупайте меньше и медленнее, как в примере с Лукойлом.", "lesson": "7.17"}]}, {"id": "8", "title": "Итоговый тест", "lessons": "0.1–8.0", "questions": [{"q": "Акция упала на 25% ниже вашей цены покупки. Как, по уроку 8.0, принимать решение — держать или продавать?", "options": ["Держать, пока цена не вернётся к цене покупки", "Продать, раз убыток больше 20%", "Докупить ровно столько, чтобы средняя цена стала как у рынка", "По тому, что происходит с компанией, а не по тому, в плюсе вы или в минусе"], "correct": 3, "explain": "Это ловушка привязки к цене покупки: рынку всё равно, по какой цене вы купили.", "lesson": "8.0"}, {"q": "Вы купили акцию и читаете о ней только хорошие новости. Какой совет даёт урок 8.0?", "options": ["Читать только хорошие новости, чтобы не нервничать", "Специально искать доводы против своей идеи: если сильных доводов нет, идея крепче", "Отписаться от всех новостей о компании", "Купить ещё, раз новости хорошие"], "correct": 1, "explain": "Ловушка поиска подтверждений: человек замечает только то, что согласуется с его решением.", "lesson": "8.0"}, {"q": "Причины для покупки акции уже нет, но вы ждёте, когда она вернётся к цене покупки. Что предлагает урок?", "options": ["Ждать сколько угодно — когда-нибудь цена вернётся", "Докупать на каждом падении, пока цена не вернётся", "Поставить стоп-лосс ниже текущей цены", "Иногда правильнее признать ошибку и переложить деньги в более сильную идею"], "correct": 3, "explain": "Это ловушка «вернуть своё»: решение держится на прошлой цене, а не на перспективах компании.", "lesson": "8.0"}, {"q": "«Деньги всё равно обесцениваются, поэтому лучше их сразу потратить». Что не так в этой мысли?", "options": ["Ничего: при инфляции копить бессмысленно", "Инфляция — как раз причина вкладывать: потраченные деньги уже не работают на вас", "Деньги не обесцениваются, если держать их наличными", "Тратить нужно только на машину — она дорожает вместе с инфляцией"], "correct": 1, "explain": "Урок 8.0: большинство вещей дешевеет с первого дня, а машина ещё и требует расходов. Капитал растёт от регулярных вложений и времени.", "lesson": "8.0"}, {"q": "Какой порядок действий урок 8.0 называет правильным?", "options": ["Выбор лучшей акции → кредит на её покупку → подушка из прибыли", "Подушка безопасности → регулярное накопление капитала → выбор, куда его вложить", "Трейдинг → инвестиции → подушка", "Покупка недвижимости → подушка → накопления"], "correct": 1, "explain": "Инвестиции начинаются не с выбора акции, а с привычки накапливать. Капитал растёт от суммы и времени, а не от одной удачной сделки.", "lesson": "8.0"}, {"q": "Пять прибыльных сделок подряд — и хочется взять объём вдвое больше. Как это называют в уроке?", "options": ["Правильное наращивание позиции по тренду", "Признак, что система стала лучше", "Тильт после прибылей — такой же опасный, как после убытков", "Ребалансировка торгового счёта"], "correct": 2, "explain": "После прибылей кажется, что рынок понятен: появляется азарт, растёт плечо, и рынок быстро забирает всё назад.", "lesson": "7.15"}, {"q": "Цена подошла к стопу. Трейдер переносит стоп ниже и докупает, «чтобы усредниться». Чем это грозит?", "options": ["Небольшой плановый убыток может превратиться в огромный: минус 5% — в минус 50%", "Ничем: усреднение всегда снижает риск", "Только лишней комиссией", "Это лучший способ быстро выйти в ноль"], "correct": 0, "explain": "Трейдеру важно признавать ошибки. Перенос стопа и усреднение убытка — главные способы слить депозит.", "lesson": "7.15"}, {"q": "Линии MACD ещё не пересеклись, но столбики гистограммы начали уменьшаться. Что это говорит?", "options": ["Движение ускоряется", "Движение выдыхается ещё до пересечения линий", "Это сигнал к покупке с плечом", "Гистограмма ничего не показывает"], "correct": 1, "explain": "Гистограмма показывает ускорение: растущие столбики — сила, уменьшающиеся — ослабление импульса.", "lesson": "7.6"}, {"q": "Двойная вершина: две вершины около 330 ₽, промежуточный минимум — 310 ₽. Когда появляется сигнал и какова цель по высоте фигуры?", "options": ["После закрытия свечи ниже 310 ₽; цель — около 290 ₽", "Сразу на второй вершине; цель — 310 ₽", "После закрытия свечи ниже 310 ₽; цель — около 250 ₽", "После пробоя 330 ₽ вверх; цель — около 350 ₽"], "correct": 0, "explain": "Сигнал — закрытие ниже минимума между вершинами. Цель: высота фигуры (330 − 310 = 20 ₽), отложенная вниз от точки пробоя: 310 − 20 = 290 ₽.", "lesson": "7.7"}, {"q": "Сильная поддержка, RSI ниже 30, у уровня закрылся молот, стоп и размер посчитаны. Но ближайшее сопротивление всего на 1,5 стопа выше входа. Входить ли по чек-листу отскока?", "options": ["Да: все остальные условия выполнены", "Да, но без стопа, чтобы улучшить соотношение", "Да, если увеличить объём вдвое", "Нет: цель должна быть минимум в два раза дальше стопа"], "correct": 3, "explain": "Чек-лист урока 7.13: сильный уровень, перепроданность или дивергенция, разворотная свеча после закрытия, стоп и размер посчитаны, цель минимум вдвое дальше стопа.", "lesson": "7.13"}, {"q": "Кредит стоит 20% годовых, а рынок в хороший год даёт 15%. Почему нельзя инвестировать на заёмные деньги?", "options": ["Даже в хороший год вы гарантированно теряете, а в плохой — теряете вдвойне", "Можно, если брать кредит на короткий срок", "Можно, если покупать только облигации", "Нельзя только потому, что брокер не принимает кредитные деньги"], "correct": 0, "explain": "Правило Артура: на рынок — только свободные деньги на 3+ года, без кредитов. Заёмные деньги превращают временную просадку в окончательную потерю.", "lesson": "1.3"}, {"q": "Чем контроль риска у Артура в инвестициях отличается от трейдинга?", "options": ["Везде одинаково: стоп-лосс 2% от цены входа", "В инвестициях — стопом 10%, в трейдинге — долей в портфеле", "В инвестициях — долей бумаги в портфеле (обычно до 10%, максимум 20%), в трейдинге — стопом и риском 2–3% торгового депозита на сделку", "В инвестициях риск не контролируется вообще"], "correct": 2, "explain": "В инвестициях стоп не ставится, риск ограничивают диверсификацией. В трейдинге стоп обязателен, а риск считают от торгового депозита.", "lesson": "2.3"}, {"q": "Вы продаёте российские акции, купленные больше трёх лет назад, с прибылью. Что важно знать по уроку 2.6?", "options": ["Прибыль может быть освобождена от налога по льготе за долгое владение — в пределах лимита", "Налог будет в два раза выше из-за долгого срока", "Льгота распространяется и на полученные дивиденды", "Налог платится каждый год, пока вы держите акции"], "correct": 0, "explain": "Льгота за долгое владение (больше 3 лет) освобождает прибыль от продажи в пределах лимита. На дивиденды и купоны она не распространяется.", "lesson": "2.6"}, {"q": "Где и как правильно хранить сид-фразу от криптокошелька?", "options": ["Скриншотом в галерее телефона, чтобы не потерять", "В заметках или в «Избранном» мессенджера", "На бумаге от руки, в двух копиях в разных надёжных местах — никаких скриншотов, заметок и облаков", "Отправить в поддержку биржи на хранение"], "correct": 2, "explain": "Кто знает сид-фразу, тот и владеет деньгами. Галерея синхронизируется с облаком, а ни поддержка, ни биржа сид-фразу никогда не спрашивают.", "lesson": "6.5"}, {"q": "За месяц 10 сделок: 4 прибыльные в среднем по +2 000 ₽ и 6 убыточных в среднем по −1 000 ₽. Что можно сказать о системе?", "options": ["Она убыточна: прибыльных сделок меньше половины", "Итог нулевой", "Систему нужно срочно менять после первого же месяца", "Она в плюсе на 2 000 ₽: при средней прибыли вдвое больше среднего убытка система может зарабатывать даже при 40% прибыльных сделок"], "correct": 3, "explain": "4 × 2 000 − 6 × 1 000 = +2 000 ₽. И оценивать систему нужно хотя бы по 20–30 сделкам, а не по одному месяцу.", "lesson": "7.16"}]}], "trade": [{"situation": "Сигнала по вашей стратегии нет, но в чате пишут, что монета вот-вот «полетит». Хочется зайти на небольшую сумму.", "answer": "skip", "explain": "Нет сигнала по системе — нет и сделки. Совет из чата — не обоснование, а сделка вне правил считается ошибкой, даже если принесёт прибыль.", "lesson": "7.16"}, {"situation": "Недельная поддержка держится больше года, цена трижды от неё разворачивалась. RSI показал бычью дивергенцию, у уровня закрылся молот. Стоп за минимумом с запасом, риск 2%, цель у сопротивления в 3 раза дальше стопа.", "answer": "trade", "explain": "Все условия стратегии отскока совпали: сильный уровень, дивергенция, разворотная свеча после закрытия, стоп и размер посчитаны, цель больше двух стопов.", "lesson": "7.13"}, {"situation": "Сегодня у вас уже три стопа подряд — это ваш дневной лимит. И тут на графике появляется красивый сетап.", "answer": "skip", "explain": "Дневной лимит убытка исчерпан — на сегодня торговля закончена. После серии убытков нужен перерыв и меньший объём.", "lesson": "7.15"}, {"situation": "Вы едете в такси в аэропорт, связь то и дело пропадает, а по нефти появился сигнал.", "answer": "skip", "explain": "Плохая связь и дорога — одна из пяти ситуаций, когда Артур не торгует: рынок развернётся ровно тогда, когда связь пропадёт.", "lesson": "7.15"}, {"situation": "Дневная свеча закрылась выше сопротивления, под которым цена ходила два месяца, на объёме втрое выше среднего. Стоп — обратно внутри диапазона, риск 2% депозита.", "answer": "trade", "explain": "Корректный сигнал пробоя: закрытие свечи выше уровня на заметно выросшем объёме, стоп и риск по правилам.", "lesson": "7.14"}, {"situation": "После пяти прибыльных сделок подряд вы чувствуете, что «поймали рынок», и хотите открыть следующую сделку двойным объёмом.", "answer": "skip", "explain": "Это эйфория и тильт после прибылей: растут азарт и плечо, и рынок быстро забирает всё назад.", "lesson": "7.15"}, {"situation": "Двадцать минут назад вышла шоковая новость, цена мечется на несколько процентов вверх и вниз. Хочется успеть поймать движение.", "answer": "skip", "explain": "В первые часы после шока цена ходит хаотично, и сделки на эмоциях чаще всего убыточные — форс-мажор входит в список «не торгую».", "lesson": "7.15"}, {"situation": "Цена пробила уровень, вы не стали догонять. Через день она вернулась к пробитому уровню, он удержался как поддержка, и закрылась свеча бычьего поглощения. Стоп под уровнем, размер посчитан.", "answer": "trade", "explain": "Спокойный вход на ретесте: пробитое сопротивление работает как поддержка, вход подтверждён свечой, стоп и размер по правилам.", "lesson": "7.14"}, {"situation": "Цена проколола сопротивление хвостом свечи, но до закрытия часа ещё 40 минут. Хочется купить, пока не убежала.", "answer": "skip", "expl   document.getElementById('ck').onclick=ck;document.getElementById('v').onkeydown=e=>{if(e.key==='Enter')ck()};scrollTo(0,0)};
 show()}
